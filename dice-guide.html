<h1>Dice Roller Guide</h1>
<h2>Everything you need before the game starts.</h2>
<hr />
<h3>What you need:</h3>
<ul>
  <li>Two six-sided dice</li>
  <li>A flat table</li>
  <li>A pen and a score sheet</li>
</ul>
<h3>How to score</h3>
<p>Add the two dice together. A double gives you one extra roll.</p>
